[package]
name = "muxscale-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared client core: protocol codec, grid model, and crypto for the muxscale apps"

[lib]
# staticlib and cdylib are what the iOS XCFramework and Android .so need.
crate-type = ["lib", "staticlib", "cdylib"]
name = "muxscale_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
blake2 = "0.10"
base64 = "0.22"
# The bindgen toolchain (and its template engine) must not be a dependency of
# the library that ships on a phone. It is pulled in only for the
# uniffi-bindgen binary, behind a feature.
uniffi = { version = "0.29" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[features]
# Enables the bindgen CLI. Build tooling only; never enabled for the app.
bindgen = ["uniffi/cli"]

[[bin]]
# The bindgen entry point, invoked by tools/gen-bindings.sh to emit Swift and
# Kotlin. Not shipped in the app.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
